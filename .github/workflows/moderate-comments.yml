# Moderate the page's comments from GitHub: Actions > Moderate comments > Run workflow.
# Hide keeps a comment but takes it off the page; delete removes it for good;
# close/open turns posting off or on (people can still read). "list" shows the latest 50.
name: Moderate comments

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [list, hide, unhide, delete, close posting, open posting]
        default: list
      comment_id:
        description: Comment id (for hide / unhide / delete; get it from "list")
        required: false

permissions:
  contents: read

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b08f3c47604042d9401f88f7dc4fa12a
      ACTION: ${{ inputs.action }}
      ID: ${{ inputs.comment_id }}
    steps:
      - name: Run
        run: |
          run() { npx --yes wrangler@4 d1 execute essick-rocker-comments --remote --command "$1"; }
          need_id() { [[ "$ID" =~ ^[a-f0-9-]{36}$ ]] || { echo "::error::Give the comment id (from list)"; exit 1; }; }
          case "$ACTION" in
            list)            run "SELECT id, created_at, hidden, name, substr(body, 1, 120) AS body FROM essick_comments ORDER BY created_at DESC LIMIT 50" ;;
            hide)            need_id; run "UPDATE essick_comments SET hidden = 1 WHERE id = '$ID'" ;;
            unhide)          need_id; run "UPDATE essick_comments SET hidden = 0 WHERE id = '$ID'" ;;
            delete)          need_id; run "DELETE FROM essick_comments WHERE id = '$ID'" ;;
            "close posting") run "UPDATE essick_settings SET value = '0' WHERE key = 'posting_enabled'" ;;
            "open posting")  run "UPDATE essick_settings SET value = '1' WHERE key = 'posting_enabled'" ;;
          esac
