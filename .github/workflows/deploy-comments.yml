# Puts the comments service live on Cloudflare (Marcella Foundation account) on every push
# to main that changes it. Free: GitHub Actions minutes are free on public repos, and the
# Worker and its D1 database are well inside Cloudflare's free tier.
#
# Needs one repo secret, CLOUDFLARE_API_TOKEN: a Cloudflare API token on the Marcella
# Foundation account with Workers Scripts: Edit and D1: Edit.
name: Deploy comments service

on:
  push:
    branches: [main]
    paths:
      - 'comments-api/**'
      - '.github/workflows/deploy-comments.yml'
  workflow_dispatch:

concurrency:
  group: comments-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: comments-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b08f3c47604042d9401f88f7dc4fa12a
      DB_NAME: essick-rocker-comments
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test test/*.test.mjs

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repo secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Find or create the database
        run: |
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            echo "Creating D1 database $DB_NAME"
            # From an empty folder, so wrangler cannot add a second binding to wrangler.toml
            (cd "$RUNNER_TEMP" && $WRANGLER d1 create "$DB_NAME")
            id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create $DB_NAME"; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml
          echo "Database $DB_NAME is $id"

      - name: Apply database migrations
        run: $WRANGLER d1 migrations apply DB --remote

      - name: Deploy the Worker
        run: $WRANGLER deploy

      - name: Set the rate-limit salt once (kept across deploys)
        run: |
          if ! $WRANGLER secret list --format json | jq -e '.[] | select(.name == "ESSICK_IP_SALT")' > /dev/null; then
            openssl rand -hex 32 | $WRANGLER secret put ESSICK_IP_SALT
          fi

      - name: Check it answers
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://essick-rocker-comments.sean-b08.workers.dev/comments)
            echo "GET /comments -> $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          exit 1
